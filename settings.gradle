    ':FacadePattern': 'Structural Patterns/Facade/FacadePattern',
    ':FlyweightPattern': 'Structural Patterns/Flyweight/FlyweightPattern',
    ':ProxyPattern': 'Structural Patterns/Proxy/ProxyPattern',
    
    ':ChainOfResponsibilityPattern': 'Behavioral Patterns/Chain of Responsibility/ChainOfResponsibilityPattern',
